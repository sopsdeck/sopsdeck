<!doctype html>
<html lang="en" data-width="1280" data-height="640">
  <head>
    <meta charset="utf-8" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@600&family=Manrope:wght@600;800&display=swap"
      rel="stylesheet"
    />
    <style>
      html,
      body {
        margin: 0;
        width: 1280px;
        height: 640px;
        overflow: hidden;
        color: #f7f9fc;
        background: #101828;
        font-family: Manrope, sans-serif;
      }
      body {
        position: relative;
        box-sizing: border-box;
        padding: 72px 80px;
      }
      .ring {
        position: absolute;
        width: 420px;
        height: 420px;
        right: -150px;
        top: -170px;
        border: 88px solid #3157f6;
        border-radius: 50%;
        opacity: 0.55;
        pointer-events: none;
      }
      .logo {
        display: flex;
        align-items: center;
        gap: 18px;
        font-size: 36px;
        font-weight: 800;
        letter-spacing: -0.055em;
      }
      .logo svg {
        width: 48px;
        height: 48px;
      }
      .kicker {
        margin: 108px 0 0;
        color: #46d6a8;
        font:
          600 14px/1 'IBM Plex Mono',
          ui-monospace,
          monospace;
        letter-spacing: 0.08em;
        text-transform: uppercase;
      }
      h1 {
        max-width: 14ch;
        margin: 16px 0 0;
        font-size: 76px;
        font-weight: 800;
        line-height: 0.96;
        letter-spacing: -0.065em;
      }
      p {
        max-width: 22ch;
        margin: 22px 0 0;
        color: rgba(247, 249, 252, 0.72);
        font-size: 22px;
        font-weight: 600;
        line-height: 1.35;
      }
    </style>
  </head>
  <body>
    <div class="ring"></div>
    <div class="logo">
      <svg viewBox="0 0 64 64" fill="none" aria-hidden="true">
        <path
          d="M11 13h36l6 7-13 12 13 12-6 7H11l13-19L11 13Z"
          stroke="#F7F9FC"
          stroke-width="6"
          stroke-linejoin="round"
        />
        <path d="M25 32h15" stroke="#46D6A8" stroke-width="6" stroke-linecap="round" />
      </svg>
      sopsdeck
    </div>
    <p class="kicker">Local-first secrets</p>
    <h1>Secrets stay local. Clarity travels.</h1>
    <p>SOPS-encrypted environments, without a hosted vault.</p>
  </body>
</html>
