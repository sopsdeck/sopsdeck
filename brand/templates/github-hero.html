<!doctype html>
<html lang="en" data-width="1280" data-height="640">
  <head>
    <meta charset="utf-8" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@600&family=Manrope:wght@600;800&display=swap"
      rel="stylesheet"
    />
    <style>
      html,
      body {
        margin: 0;
        width: 1280px;
        height: 640px;
        overflow: hidden;
        color: #f7f9fc;
        background: #101828;
        font-family: Manrope, sans-serif;
      }
      body {
        position: relative;
        box-sizing: border-box;
        padding: 72px 80px;
      }
      .ring {
        position: absolute;
        width: 420px;
        height: 420px;
        right: -150px;
        top: -170px;
        border: 88px solid #3157f6;
        border-radius: 50%;
        opacity: 0.55;
        pointer-events: none;
      }
      .logo {
        display: flex;
        align-items: center;
        gap: 18px;
        font-size: 36px;
        font-weight: 800;
        letter-spacing: -0.055em;
      }
      .logo svg {
        width: 48px;
        height: 48px;
      }
      .brand-deck {
        color: #46d6a8;
      }
      .logo,
      h1,
      p {
        position: relative;
      }
      .kicker {
        margin: 72px 0 0;
        color: #46d6a8;
        font:
          600 14px/1 'IBM Plex Mono',
          ui-monospace,
          monospace;
        letter-spacing: 0.08em;
        text-transform: uppercase;
      }
      h1 {
        max-width: 24ch;
        margin: 16px 0 0;
        font-size: 76px;
        font-weight: 800;
        line-height: 1.05;
        letter-spacing: -0.04em;
        text-wrap: balance;
      }
      p {
        max-width: 60ch;
        margin: 22px 0 0;
        color: rgba(247, 249, 252, 0.72);
        font-size: 22px;
        font-weight: 600;
        line-height: 1.35;
      }
    </style>
  </head>
  <body>
    <div class="ring"></div>
    <div class="logo">
      <svg viewBox="0 0 64 64" fill="none" aria-hidden="true">
        <path d="M54 10H21L10 21v15h32v9H10v9h33l11-11V27H22v-8h32Z" fill="#F7F9FC" />
      </svg>
      <span>sops<span class="brand-deck">deck</span></span>
    </div>
    <p class="kicker">For individual developers and teams</p>
    <h1>A visual browser and editor for your secrets.</h1>
    <p>Manage SOPS-encrypted files locally. Share access and track changes in Git.</p>
  </body>
</html>
