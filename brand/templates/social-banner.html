<!doctype html>
<html lang="en" data-width="1500" data-height="500">
  <head>
    <meta charset="utf-8" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@600&family=Manrope:wght@600;800&display=swap"
      rel="stylesheet"
    />
    <style>
      html,
      body {
        margin: 0;
        width: 1500px;
        height: 500px;
        overflow: hidden;
        color: #f7f9fc;
        background: #101828;
        font-family: Manrope, sans-serif;
      }
      body {
        position: relative;
        box-sizing: border-box;
        padding: 88px 96px;
      }
      .ring {
        position: absolute;
        width: 380px;
        height: 380px;
        right: -130px;
        top: -150px;
        border: 80px solid #3157f6;
        border-radius: 50%;
        opacity: 0.55;
        pointer-events: none;
      }
      .logo {
        display: flex;
        align-items: center;
        gap: 18px;
        font-size: 42px;
        font-weight: 800;
        letter-spacing: -0.055em;
      }
      .logo svg {
        width: 54px;
        height: 54px;
      }
      .brand-deck { color: #46d6a8; }
      h1 {
        max-width: 24ch;
        margin: 36px 0 0;
        font-size: 58px;
        font-weight: 800;
        line-height: 1.05;
        letter-spacing: -0.04em;
        text-wrap: balance;
      }
      p {
        margin: 16px 0 0;
        color: #46d6a8;
        font:
          600 14px/1 'IBM Plex Mono',
          ui-monospace,
          monospace;
        letter-spacing: 0.08em;
        text-transform: uppercase;
      }
    </style>
  </head>
  <body>
    <div class="ring"></div>
    <div class="logo">
      <svg viewBox="0 0 64 64" fill="none" aria-hidden="true">
        <path d="M54 10H21L10 21v15h32v9H10v9h33l11-11V27H22v-8h32Z" fill="#F7F9FC" />
      </svg>
      <span>sops<span class="brand-deck">deck</span></span>
    </div>
    <h1>A visual browser and editor for your secrets.</h1>
    <p>SOPS secrets for individual developers and teams</p>
  </body>
</html>
