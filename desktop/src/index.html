<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="stylesheet" href="styles.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=Manrope:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sopsdeck</title>
    <script>
      document.documentElement.dataset.theme =
        localStorage.getItem('sopsdeck-theme') === 'dark' ? 'dark' : 'light';
    </script>
    <script type="module" src="/main.js" defer></script>
  </head>
  <body>
    <div class="app">
      <aside class="sidebar">
        <div class="side-head">
          <div class="side-head-row">
            <span class="kicker">Projects</span>
            <button id="theme-toggle" class="theme-toggle" type="button" data-testid="theme-toggle">
              Dark mode
            </button>
          </div>
        </div>
        <nav id="tree" class="tree" aria-label="Local projects" data-testid="tree"></nav>
        <div class="side-foot">
          <button id="add-project" class="add-project" type="button" data-testid="add-project">
            Add folder from disk
          </button>
        </div>
      </aside>
      <section class="editor">
        <header class="editor-head">
          <p id="breadcrumb" class="breadcrumb" data-testid="breadcrumb">
            Add a project folder to begin
          </p>
          <div class="headline">
            <div>
              <h1 id="headline" data-testid="headline">Sopsdeck</h1>
              <p id="subline" class="subline">Encrypted files stay on this machine</p>
            </div>
            <span id="badge" class="encrypted" hidden>SOPS encrypted</span>
          </div>
        </header>
        <div id="toolbar" class="toolbar" hidden>
          <button id="add-secret" class="tool primary" type="button" data-testid="add-secret">
            Add secret
          </button>
          <button id="reveal" class="tool" type="button" data-testid="reveal">Reveal values</button>
        </div>
        <p id="error" class="error" hidden data-testid="editor-error"></p>
        <p id="empty-state" class="empty-state" hidden data-testid="empty-state"></p>
        <div id="keys" class="keys" data-testid="keys"></div>
      </section>
      <aside class="inspector">
        <div class="inspect-head">
          <span class="kicker">Environment</span>
        </div>
        <section class="inspect-section">
          <h2>File</h2>
          <div class="meta">
            <span>Path</span><strong id="meta-path" data-testid="inspector-path">—</strong>
            <span>Format</span><strong id="meta-format">—</strong> <span>Encryption</span
            ><strong id="meta-enc">—</strong>
          </div>
        </section>
        <section class="inspect-section">
          <h2>Git</h2>
          <label class="commit-label">
            Message
            <input
              id="commit-message"
              type="text"
              placeholder="What changed"
              data-testid="commit-message"
            />
          </label>
          <button id="commit" class="tool git-action" type="button" data-testid="commit">
            Commit
          </button>
          <button id="sync" class="tool git-action" type="button" data-testid="sync">Sync</button>
          <p id="git-error" class="control-error" hidden data-testid="git-error"></p>
          <p class="save-note">Sync is fetch, ff-only pull, then push</p>
        </section>
        <div class="save-zone">
          <button id="save" class="save" type="button" disabled data-testid="save">
            Encrypt &amp; save
          </button>
          <p id="save-error" class="control-error" hidden data-testid="save-error"></p>
          <div class="save-note">Writes only to your local file</div>
        </div>
      </aside>
    </div>
  </body>
</html>
